name: Parent last-known label visual check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.6', channel: stable}
      - name: Isolated fixture and throwaway signer
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/t.jks -alias t -keyalg RSA -keysize 2048 -validity 30 -storepass testtest -keypass testtest -dname CN=test
          printf '\nCHILD_KEYSTORE_FILE=%s\nCHILD_KEYSTORE_PASSWORD=testtest\nCHILD_KEY_ALIAS=t\nCHILD_KEY_PASSWORD=testtest\n' $RUNNER_TEMP/t.jks >> android/gradle.properties
          python3 device-tests/make_fixture.py
          flutter pub get
          flutter build apk --debug --target-platform android-x64 -t lib/runtime_fixture.dart
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pip install uiautomator2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          disable-animations: true
          script: adb install build/app/outputs/flutter-apk/app-debug.apk && adb shell pm grant com.childsafety.parent android.permission.POST_NOTIFICATIONS && python3 device-tests/lastknown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: last-known-results, path: device-results}
