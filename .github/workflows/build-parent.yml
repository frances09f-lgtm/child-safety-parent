name: Build Child Safety Parent
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parent-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Record release commit
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Restore permanent signer
        env:
          CHILD_KEYSTORE_BASE64: ${{ secrets.CHILD_KEYSTORE_BASE64 }}
          CHILD_KEYSTORE_PASSWORD: ${{ secrets.CHILD_KEYSTORE_PASSWORD }}
          CHILD_KEY_ALIAS: ${{ secrets.CHILD_KEY_ALIAS }}
          CHILD_KEY_PASSWORD: ${{ secrets.CHILD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CHILD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/child-release.jks"
          printf '\nCHILD_KEYSTORE_FILE=%s\nCHILD_KEYSTORE_PASSWORD=%s\nCHILD_KEY_ALIAS=%s\nCHILD_KEY_PASSWORD=%s\n' "$RUNNER_TEMP/child-release.jks" "$CHILD_KEYSTORE_PASSWORD" "$CHILD_KEY_ALIAS" "$CHILD_KEY_PASSWORD" >> android/gradle.properties
      - name: Analyze
        run: flutter pub get && flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test --reporter expanded
      - name: Signed ARM + ARM64 APK
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: child-safety-parent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish green v1.4.15 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '1.4.15+20'
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/ChildSafetyParent.apk"
          gh release create v1.4.15 "$RUNNER_TEMP/ChildSafetyParent.apk#ChildSafetyParent.apk" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Child Safety Parent v1.4.15' --notes 'Adds the 32-bit ARM (armeabi-v7a) Flutter engine and app library alongside ARM64. Every earlier build shipped the ARM64 engine only, so the app closed immediately on phones with a 32-bit Android system such as the Redmi 7A: the installer finds no 32-bit engine in those builds. All features and screens are unchanged from v1.4.14. Retest on a 32-bit phone pending. Signed ARM + ARM64 APK after successful static analysis and tests. No phone testing claimed.'
      - name: Update update-feed (child-safety-updates)
        env:
          FEED_TOKEN: ${{ secrets.UPDATES_FEED_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$FEED_TOKEN" ]; then
            echo "::warning::UPDATES_FEED_TOKEN secret is not set, so version.json in child-safety-updates was not updated"
            exit 0
          fi
          VER="$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)"
          NOTES="$(gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          git clone "https://x-access-token:${FEED_TOKEN}@github.com/frances09f-lgtm/child-safety-updates.git" "$RUNNER_TEMP/feed"
          cd "$RUNNER_TEMP/feed"
          VER="$VER" NOTES="$NOTES" REPO="$GITHUB_REPOSITORY" python3 - <<'PY'
          import json, os
          p = 'version.json'
          d = json.load(open(p))
          v = os.environ['VER']
          d['parent'] = {
              'version': v,
              'notes': os.environ['NOTES'],
              'apk': 'https://github.com/%s/releases/download/v%s/ChildSafetyParent.apk' % (os.environ['REPO'], v),
          }
          open(p, 'w').write(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo "feed already current"; exit 0; fi
          git commit -am "parent $VER: update feed from release"
          git push origin HEAD:main
