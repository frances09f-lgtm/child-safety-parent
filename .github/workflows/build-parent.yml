name: Build Child Safety Parent
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Restore permanent signer
        env:
          CHILD_KEYSTORE_BASE64: ${{ secrets.CHILD_KEYSTORE_BASE64 }}
          CHILD_KEYSTORE_PASSWORD: ${{ secrets.CHILD_KEYSTORE_PASSWORD }}
          CHILD_KEY_ALIAS: ${{ secrets.CHILD_KEY_ALIAS }}
          CHILD_KEY_PASSWORD: ${{ secrets.CHILD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CHILD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/child-release.jks"
          printf '\nCHILD_KEYSTORE_FILE=%s\nCHILD_KEYSTORE_PASSWORD=%s\nCHILD_KEY_ALIAS=%s\nCHILD_KEY_PASSWORD=%s\n' "$RUNNER_TEMP/child-release.jks" "$CHILD_KEYSTORE_PASSWORD" "$CHILD_KEY_ALIAS" "$CHILD_KEY_PASSWORD" >> android/gradle.properties
      - run: flutter pub get && flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 --build-name=1.4.9 --build-number=14
      - uses: actions/upload-artifact@v4
        with:
          name: child-safety-parent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish green v1.4.9 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/ChildSafetyParent.apk"
          gh release create v1.4.9 "$RUNNER_TEMP/ChildSafetyParent.apk#ChildSafetyParent.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Child Safety Parent v1.4.9" --notes "Approved parent UI redesign with green home launcher icon. Signed ARM64 Android APK built after successful analysis and tests. No phone testing claimed."
