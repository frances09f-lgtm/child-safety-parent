name: Apply SOS notification change
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_sos.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.yaml
          git commit -m 'SOS notification from the server alert list and Children tab SOS ordering'
          git push origin HEAD:feat/sos-notification-order
