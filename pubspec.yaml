name: child_safety_parent
description: Private family overview and child location dashboard.
publish_to: none
version: 1.4.11+16
environment:
  sdk: ^3.10.4
dependencies:
  shared_preferences: ^2.3.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  workmanager: ^0.10.10
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
